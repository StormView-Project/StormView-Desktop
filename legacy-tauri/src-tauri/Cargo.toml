[package]
name = "stormview"
version = "1.0.0"
description = "StormView — live radar, forecasts and weather alerts, in Material 3 Expressive"
authors = ["arc360"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "stormview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
