# Builds Linux and Windows releases when a pushed commit message contains a
# version like "v2.1.0" (or "v2.1"), then publishes them as a GitHub release
# tagged with that version. macOS is covered by the separate Swift app.
name: Release

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  version:
    name: Find version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.find.outputs.version }}
    steps:
      - id: find
        env:
          # Passed through env, never inlined, so commit text can't inject shell.
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          v=$(printf '%s\n' "$MESSAGE" | grep -oE '(^|[^[:alnum:]])v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?' | head -n1 | sed -E 's/^[^v]*v//' || true)
          if [ -z "$v" ]; then
            echo "No version in the commit message; skipping the release."
            exit 0
          fi
          # Cargo needs three numbers: v2.1 becomes 2.1.0.
          core=${v%%-*}
          case "$core" in *.*.*) ;; *) v="${core}.0${v#"$core"}" ;; esac
          echo "Releasing v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            # Oldest supported runner, so the binary runs on older glibc too.
            os: ubuntu-22.04
            asset: stormview-linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            asset: stormview-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set the crate version
        shell: bash
        run: sed -i -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml

      - name: Build
        run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir=stormview-$VERSION-linux-x86_64
          mkdir "$dir"
          cp target/release/stormview "$dir/"
          cp app-icon.png "$dir/stormview.png"
          cp packaging/stormview.desktop "$dir/"
          cp packaging/install-binary.sh "$dir/install.sh"
          cp README.md "$dir/"
          tar czf "${{ matrix.asset }}" "$dir"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "stormview-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/stormview.exe $dir/StormView.exe
          Copy-Item README.md $dir/
          Compress-Archive -Path $dir -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and release with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: StormView v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: dist/*
