[package]
name = "stormview"
version = "2.0.0"
edition = "2021"
description = "StormView — native radar, forecasts and alerts in Material 3"
license = "MIT"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility"] }
material-colors = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
lru = "0.12"
directories = "6"
open = "5"
arboard = { version = "3", default-features = false }
notify-rust = "4"
dark-light = "2"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
